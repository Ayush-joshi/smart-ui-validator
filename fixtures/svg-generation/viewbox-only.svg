<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eeff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="320" height="180" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" style="font-family:Arial,sans-serif;fill:#14213d">
    <rect width="320" height="180" fill="url(#surface)"/>
    <text x="24" y="52" font-size="24">ViewBox layout</text>
  </g>
</svg>
