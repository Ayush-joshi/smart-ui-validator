[mcp_servers.smart_ui]
command = "node"
args = ["/ABSOLUTE/PATH/TO/smart-ui-validator/apps/mcp-server/dist/index.js"]
cwd = "/ABSOLUTE/PATH/TO/TARGET-REPOSITORY"
startup_timeout_sec = 20
tool_timeout_sec = 120
required = true
enabled = true
enabled_tools = [
  "prepare_workflow",
  "inspect_project",
  "normalize_design",
  "plan_component",
  "validate_component",
  "repair_component",
  "get_findings",
  "get_run",
  "get_report",
  "answer_question",
  "continue_run",
  "memory_status",
  "list_memories",
  "explain_memory",
  "propose_memory",
  "confirm_memory",
  "reject_memory",
  "forget_memory",
  "inspect_svg",
  "generate_html_from_svg",
  "export_generation",
  "get_generation",
  "get_generation_report",
  "list_handoff_tasks",
  "get_handoff_task",
  "read_handoff_evidence",
  "submit_handoff_generation",
  "submit_handoff_implementation",
]
default_tools_approval_mode = "writes"

[mcp_servers.smart_ui.tools.repair_component]
approval_mode = "prompt"

[mcp_servers.smart_ui.tools.confirm_memory]
approval_mode = "prompt"

[mcp_servers.smart_ui.tools.forget_memory]
approval_mode = "prompt"

[mcp_servers.smart_ui.tools.export_generation]
approval_mode = "prompt"

[mcp_servers.smart_ui.tools.submit_handoff_generation]
approval_mode = "prompt"

[mcp_servers.smart_ui.tools.submit_handoff_implementation]
approval_mode = "prompt"
