name: Release candidate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter smart-ui-validator-core exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm evaluate
      - run: pnpm evaluate:svg
      - run: pnpm security:secrets
      - run: pnpm privacy:check
      - run: pnpm package:check
      - run: pnpm consumer:check
      - run: pnpm publish:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm sbom
      - name: Pack core candidate (no publish)
        run: pnpm --dir packages/core pack --pack-destination "${{ github.workspace }}/artifacts"
      - name: Pack CLI candidate (no publish)
        run: pnpm --dir apps/cli pack --pack-destination "${{ github.workspace }}/artifacts"
      - name: Pack MCP candidate (no publish)
        run: pnpm --dir apps/mcp-server pack --pack-destination "${{ github.workspace }}/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            artifacts/*.tgz
            svg-generation-scorecard.json
            sbom.local.json
