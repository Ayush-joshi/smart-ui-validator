name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-ui/core exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm evaluate
      - run: pnpm security:secrets
      - run: pnpm package:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm sbom
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            evaluation-scorecard.json
            sbom.local.json
          if-no-files-found: error
